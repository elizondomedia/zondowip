<script>
/* ELEMENTORB: One Orb. Endless Possibilities. One self-contained file: no libraries, no assets, no build step. */
(()=>{'use strict';
/* ===== CORE: canvas, helpers, save, audio, particles ===== */
const VW=960,VH=540,TAU=Math.PI*2,TOP=-300,GY=460;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function resize(){const d=Math.min(2,window.devicePixelRatio||1),s=Math.min(innerWidth/VW,innerHeight/VH),w=Math.floor(VW*s),h=Math.floor(VH*s);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.floor((innerWidth-w)/2)+'px';
  cv.style.top=Math.floor((innerHeight-h)/(innerHeight>innerWidth?6:2))+'px';cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const appr=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rdist=(r,x,y)=>Math.hypot(Math.max(r.x-x,0,x-r.x-r.w),Math.max(r.y-y,0,y-r.y-r.h));
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'};
let T=0,S=null;
/* full screen: the whole page goes full screen so the touch buttons stay on top */
const FSE=document.documentElement,fsOK=!!(FSE&&(FSE.requestFullscreen||FSE.webkitRequestFullscreen));
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){if(!fsOK)return;try{if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{const r=(FSE.requestFullscreen||FSE.webkitRequestFullscreen).call(FSE);const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};if(r&&r.then)r.then(lock).catch(()=>{});else lock()}}catch(e){}}

/* ----- save: versioned, validated field by field ----- */
const SAVE_KEY='elementum.save',SAVE_V=2;
function defSave(){return{v:SAVE_V,started:false,el:{normal:1},cur:'normal',done:{},diff:{},frag:{},mem:{},wh:{},far:{},rd:0,realm:null,ck:0,deaths:0,time:0,ended:false,hubx:0,
  set:{music:3,sfx:3,fx:1,shake:1,calm:0,hints:1}}}
function loadSave(){const d=defSave();try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return d;const o=JSON.parse(raw);
  if(!o||o.v!==SAVE_V||typeof o.el!=='object'||!o.el)return d;
  for(const k of ORDER)if(o.el[k]===1||o.el[k]===2||o.el[k]===3)d.el[k]=o.el[k];
  d.el.normal=1;if(d.el.gold)d.el.gold=1;
  d.started=!!o.started;d.cur=d.el[o.cur]&&o.cur!=='gold'?o.cur:'normal';
  for(const k of['done','frag','mem','wh'])if(o[k]&&typeof o[k]==='object')for(const j in o[k])if(o[k][j])d[k][j]=1;
  PATHS.forEach((p,i)=>{if(p[1].every(e=>d.done[ZONE[e][0]]))d.done['path'+(i+1)]=1}); /* saves from the 16-realm build */
  for(const r of REALMS)if(d.done[r.id])d.diff[r.id]=((o.diff&&o.diff[r.id])|0)&7|1;d.rd=clamp(o.rd|0,0,2);
  if(o.far&&typeof o.far==='object')for(const j in o.far)if(REALM_BY[j])d.far[j]=o.far[j]|0;
  d.realm=typeof o.realm==='string'&&REALM_BY[o.realm]?o.realm:null;d.ck=o.ck|0;d.deaths=o.deaths|0;d.time=+o.time||0;d.ended=!!o.ended;d.hubx=+o.hubx||0;
  if(o.set&&typeof o.set==='object')for(const k in d.set)if(typeof o.set[k]==='number'&&isFinite(o.set[k]))d.set[k]=clamp(o.set[k]|0,0,4);
  return d}catch(e){return defSave()}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ----- audio: everything synthesized, starts on first input ----- */
let AC=null,MUS=null,SFX=null,drone=[],mood=55,chimeT=2;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  try{AC=new A();MUS=AC.createGain();SFX=AC.createGain();MUS.connect(AC.destination);SFX.connect(AC.destination);applyVol();
    [1,1.5,2.01].forEach((m,i)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type=i?'sine':'triangle';o.frequency.value=mood*m;g.gain.value=.05/(i+1);l.frequency.value=.05+i*.04;lg.gain.value=.02/(i+1);
      l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(MUS);o.start();l.start();drone.push({o,m})})}catch(e){AC=null}}
function applyVol(){if(!AC)return;MUS.gain.value=S.set.music/4;SFX.gain.value=S.set.sfx/4}
function setMood(r){mood=r;if(!AC)return;try{drone.forEach(d=>d.o.frequency.setTargetAtTime(r*d.m,AC.currentTime,1.5))}catch(e){}}
function tone(f,d,type,v,f2,mus){if(!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0008,n+d);
  o.connect(g);g.connect(mus?MUS:SFX);o.start(n);o.stop(n+d+.02)}catch(e){}}
const SND={jump:[420,.14,'sine',.05,700],land:[130,.1,'sine',.05,60],hurt:[220,.4,'sawtooth',.07,50],atk:[620,.12,'square',.035,240],ehit:[300,.1,'triangle',.05,160],gold:[523,1.6,'triangle',.08,2093],deny:[160,.15,'square',.03,120],ck:[660,.5,'sine',.06,990],
  frag:[900,.4,'triangle',.06,1400],portal:[400,.9,'sine',.07,1600],equip:[520,.25,'sine',.05,880],ui:[700,.06,'sine',.03,900],open:[200,.6,'triangle',.05,400],
  break:[140,.3,'sawtooth',.06,50],master:[523,1.1,'triangle',.07,1568],mem:[330,1.4,'sine',.06,660]};
function sfx(n){const s=SND[n];if(s)tone(s[0],s[1],s[2],s[3],s[4])}
const PENT=[1,1.125,1.25,1.5,1.667,2];
function chime(dt){chimeT-=dt;if(chimeT<=0){chimeT=rnd(2.2,5);tone(mood*4*PENT[Math.floor(Math.random()*PENT.length)],2.4,'sine',.035,0,1)}}

/* ----- particles ----- */
let PT=[],RG=[];
function em(x,y,c,n,o){o=o||{};if(PT.length>600)return;n=Math.max(1,Math.round((n||1)*(S.set.fx?1:.5)*(S.set.calm?.6:1)));
  for(let i=0;i<n;i++){const l=rnd(.4,1)*(o.l||1);PT.push({x,y,vx:rnd(-1,1)*(o.sp||30)+(o.vx||0),vy:rnd(-1,1)*(o.sp||30)+(o.up||0),l,m:l,c,s:rnd(1.4,3.6)*(o.s||1),g:o.g||0})}}
function ring(x,y,c,r){RG.push({x,y,r:r||10,c,l:.7})}
function tickFx(dt){for(let i=PT.length-1;i>=0;i--){const q=PT[i];q.l-=dt;if(q.l<=0){PT[i]=PT[PT.length-1];PT.pop();continue}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
  for(let i=RG.length-1;i>=0;i--){const r=RG[i];r.r+=320*dt;r.l-=dt;if(r.l<=0)RG.splice(i,1)}}
function glow(x,y,r,c,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,1));g.addColorStop(1,rgba(c,0));const o=X.globalAlpha;X.globalAlpha=o*(a==null?1:a);X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);X.globalAlpha=o}
function txt(s,x,y,font,c,al,blur){X.font=font;X.fillStyle=c;X.textAlign=al||'center';if(blur){X.shadowColor=c;X.shadowBlur=blur}X.fillText(s,x,y);X.shadowBlur=0}

/* ===== DATA: the forms, their three gifts (power, attack, resistance), the realms, the journey ===== */
const EL={

  for(const k in MEM){t++;if(S.mem[k])n++}return Math.round(100*n/t)}

/* ===== WORLD: level builder, puzzle segments, resistance nooks, wisp guards, gauntlets, realm layouts =====
   Every piece also records its intended solution (b.bot) so each realm can be machine-verified. */
function Builder(d){const b={d:d||0,x:0,gy:GY,o:[],cps:[],hints:[],bot:[],n:0,fn:0};
  b.ft=()=>b.fd==null?b.d:b.fd; /* foe tier: the last two levels field more foes than their difficulty alone would */
  b.foes=(x0,list,ward)=>{for(const a of list)if(b.ft()>=(a[3]||0))b.en(a[0],x0+a[1],x0+a[2],ward)}; /* [kind, from, to, minimum foe tier] */
  b.add=(t,x,y,w,h,ex)=>{const o=Object.assign({t,x,y,w,h},ex||{});b.o.push(o);return o};
  b.ground=w=>{b.add('g',b.x,b.gy,w,900-b.gy);b.x+=w;return b};
  b.gap=w=>{b.x+=w;return b};
  b.step=dy=>{b.gy+=dy;return b};
  b.bar=(t,x,w,ex)=>b.add(t,x,TOP,w,b.gy-TOP,Object.assign({d:0,op:0},ex||{}));
  b.id=()=>'L'+(++b.n);
  b.cp=()=>{b.cps.push({x:b.x+50,y:b.gy});return b};
  b.hint=(x,s)=>{if(!b.quiet)b.hints.push([x,s]);return b};b.say=(x,s)=>{b.hints.push([x,s]);return b};
  b.frag=(x,y)=>b.add('frag',x,y,26,26,{n:b.fn++});
  b.en=(k,x0,x1,ward)=>{const s={wisp:28,shade:34,spit:30,sent:40}[k],hp={wisp:1,shade:2,spit:2,sent:4}[k];
    return b.add('en',x0,b.gy-s-8,s,s,{k,x0,x1,dir:1,by:b.gy-s-8,stun:0,frz:0,hp,mhp:hp,ft:1.2,dot:0,fl:0,ward})};
  b.haz=(k,x,w)=>{const d={flame:[80,80],sludge:[14,14],spike:[16,16],arc:[144,160],frost:[90,90],bramble:[36,36]}[k];return b.add(k,x,b.gy-d[1],w,d[0])};
  b.level=()=>{if(b.gy!==GY){const ex=b.x;b.ground(140);b.gy=GY;b.bot.push(['R','x>',ex+150],['','g']);b.ground(300)}return b};
  return b}

function drawEnding(){X.fillStyle='rgba(3,2,10,.5)';X.fillRect(0,0,VW,VH);const t=ui.t,ox=VW/2,oy=120;X.save();X.globalCompositeOperation='lighter';glow(ox,oy,260+Math.sin(T*2)*20,'#ffd24a',.5);X.restore();drawOrb(ox,oy,46,'gold');
  if(Math.random()<.8)em(ox+rnd(-200,200),oy+rnd(-90,160),Math.random()<.3?EL[STD[Math.floor(Math.random()*16)]].c:'#ffd24a',1,{up:-30,sp:30,l:1.6});drawFx();
  const a=s=>clamp((t-s)*.8,0,1);X.save();X.globalAlpha=a(.6);txt('“From nothing, all things became possible.”',VW/2,250,'italic 22px Georgia','#eef2ff');
  X.globalAlpha=a(2.6);txt('“From many forms, one harmony emerged.”',VW/2,292,'italic 22px Georgia','#eef2ff');
  X.globalAlpha=a(4.6);txt('ELEMENTORB — MASTER OF ALL FORMS',VW/2,356,'bold 34px Georgia','#ffd24a',0,26);
  X.globalAlpha=a(6.5);txt(completion()+'% complete   ·   '+S.deaths+' falls   ·   '+fmtTime(S.time),VW/2,404,'15px Georgia','#c8d4ea');txt('The harmony holds. Press Enter or tap — return to the Sanctuary',VW/2,VH-50,'italic 16px Georgia','#ffffff');X.restore();if(t>6.5)hit(0,0,VW,VH,enterHub)}
function draw(){X.setTransform(cv.width/VW,0,0,cv.height/VH,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.shadowBlur=0;HIT.length=0;
  if(G)drawWorld();else if(scr==='main')drawTitleBg();else drawBg(T*36,0,'awakening',S.ended?'#e0b030':'#6a5cff');
  if(!scr){if(G){drawHud();if(G.wheel)drawWheel()}return}
  if(G&&scr!=='ending'){X.fillStyle='rgba(3,2,10,'+(scr==='realms'||scr==='codex'?.94:.8)+')';X.fillRect(0,0,VW,VH)}
  ({main:drawMain,codex:drawCodex,realms:drawRealms,controls:drawControls,done:drawDone,ending:drawEnding}[scr]||drawList)()}

/* ===== MAIN: input and loop ===== */
const KEYMAP={KeyA:'L',ArrowLeft:'L',KeyD:'R',ArrowRight:'R',KeyW:'U',ArrowUp:'U',KeyS:'D',ArrowDown:'D',Space:'J',KeyE:'E',ShiftLeft:'S',ShiftRight:'S'};
function press(code,touch){audioInit();if(scr){uiKey(code);return}if(!G)return;const w=G.wheel;if(w&&(w.sticky||w.t>.18)){wheelKey(code);return}
  const k=KEYMAP[code];if(k)K[k]=1;const p=G.p;
  switch(code){case'Escape':case'KeyP':G.wheel=null;openScr('pause');break;
  case'KeyQ':if(!w&&!G.tf&&G.L.id!=='hub')G.wheel={sel:WHEEL.indexOf(p.form),t:0,sticky:!!touch,moved:false};break;
  case'KeyX':case'KeyK':attack();break;case'KeyM':G.wheel=null;openScr('realms');break;
  case'KeyE':power(0);break;case'ShiftLeft':case'ShiftRight':power(1);break;case'KeyF':case'Enter':interact();break;case'KeyR':respawn(true);break;
  case'Space':case'KeyW':case'ArrowUp':if(p.ceil)p.ceil=0;else if(code==='Space'&&p.wall&&!p.g&&p.form==='sticky'){p.vy=-470;p.vx=-p.wall*260;p.lock=.18;p.wall=0;p.nocut=.3;sfx('jump')}else p.jb=.12;break;
  case'KeyS':case'ArrowDown':p.ceil=0;break}}
function release(code){const k=KEYMAP[code];if(k)K[k]=0;if(code==='KeyQ'&&G&&G.wheel&&!G.wheel.sticky)closeWheel(true)}
function mpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}}
function boot(){S=loadSave();fragTotals();resize();addEventListener('resize',resize);for(const ev of['fullscreenchange','webkitfullscreenchange','orientationchange'])document.addEventListener(ev,()=>{resize();setTimeout(resize,250)});addEventListener('orientationchange',()=>setTimeout(resize,250));
  const fb=document.getElementById('fs');if(fb){if(fsOK)document.body.classList.add('fsok');fb.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();toggleFS()})}
  addEventListener('keydown',e=>{if(e.altKey&&e.code==='Enter'){e.preventDefault();if(!e.repeat)toggleFS();return}if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Tab'||e.code==='Backspace')e.preventDefault();if(e.repeat&&!scr)return;press(e.code)});
  addEventListener('keyup',e=>release(e.code));addEventListener('blur',clearKeys);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){save();clearKeys();if(G&&!scr){G.wheel=null;openScr('pause')}}});addEventListener('pagehide',save);
  cv.addEventListener('pointermove',e=>{const m=mpos(e),w=G&&!scr&&G.wheel;if(w&&(w.sticky||w.t>.18)){const i=wheelAt(m);if(i>=0&&i!==w.sel){w.sel=i;w.moved=true}}
    else if(scr&&e.pointerType==='mouse')for(const h of HIT)if(h.i!=null&&m.x>=h.x&&m.x<=h.x+h.w&&m.y>=h.y&&m.y<=h.y+h.h)ui.i=h.i});
  cv.addEventListener('pointerdown',e=>{audioInit();const m=mpos(e),w=G&&!scr&&G.wheel;
    if(w){if(w.sticky){const i=wheelAt(m);if(i>=0){w.sel=i;closeWheel(true)}else closeWheel(false)}else if(w.t>.18)closeWheel(true);return}
    for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];if(m.x>=h.x&&m.x<=h.x+h.w&&m.y>=h.y&&m.y<=h.y+h.h){h.fn();return}}});
  const touchOn=()=>document.body.classList.add('touch');if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)touchOn();addEventListener('touchstart',touchOn,{once:true,passive:true});
  document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');press(k,true)});
    for(const v of['pointerup','pointerleave','pointercancel'])b.addEventListener(v,()=>{b.classList.remove('on');release(k)});b.addEventListener('contextmenu',e=>e.preventDefault())});
  let last=0;const frame=n=>{const dt=Math.min(.05,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(frame)};requestAnimationFrame(frame)}

boot();
})();
