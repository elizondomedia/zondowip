<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#03020a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;display:block;outline:none}

#tc,#pz,#fs{display:none}

body.touch:not(.menu) #tc{display:flex;position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:flex-end;
 padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));box-sizing:border-box;pointer-events:none}
.pad{display:flex;flex-direction:column;gap:8px;pointer-events:auto}.pad.l{align-items:center}.pad.r{align-items:flex-end}.row{display:flex;gap:9px;align-items:flex-end}
#tc b{display:grid}
#tc b,#pz,#fs{width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(140,200,255,.38);background:rgba(40,60,120,.22);color:#cfe6ff;
 place-items:center;box-shadow:0 0 12px rgba(100,180,255,.22);touch-action:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#tc b svg,#pz svg,#fs svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#tc b svg.f{fill:currentColor;stroke:none}
#tc b.s{width:42px;height:42px}#tc b.j{width:60px;height:60px}#tc b.on,#pz.on,#fs.on{background:rgba(160,210,255,.42)}

body.canF #bF,body.mag #bS{display:grid}body.hub #bX,body.hub #bE,body.hub #bQ{display:none}

body.port:not(.menu) #tc{bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
