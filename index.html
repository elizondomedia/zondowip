<script>
/* ELEMENTORB: One Orb. Endless Possibilities. One self-contained file: no libraries, no assets, no build step. */
(()=>{'use strict';
/* ===== CORE: canvas, helpers, save, audio, particles ===== */
const VW=960,VH=540,TAU=Math.PI*2,TOP=-300,GY=460;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function resize(){const d=Math.min(2,window.devicePixelRatio||1),s=Math.min(innerWidth/VW,innerHeight/VH),w=Math.floor(VW*s),h=Math.floor(VH*s);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.floor((innerWidth-w)/2)+'px';
  cv.style.top=Math.floor((innerHeight-h)/(innerHeight>innerWidth?6:2))+'px';cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const appr=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const rdist=(r,x,y)=>Math.hypot(Math.max(r.x-x,0,x-r.x-r.w),Math.max(r.y-y,0,y-r.y-r.h));
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'};
let T=0,S=null;

/* ----- save: versioned, validated field by field ----- */
const SAVE_KEY='elementum.save',SAVE_V=2;
function defSave(){return{v:SAVE_V,started:false,el:{normal:1},cur:'normal',done:{},frag:{},mem:{},wh:{},far:{},realm:null,ck:0,deaths:0,time:0,ended:false,hubx:0,
  set:{music:3,sfx:3,fx:1,shake:1,calm:0,hints:1}}}
function loadSave(){const d=defSave();try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return d;const o=JSON.parse(raw);
  if(!o||o.v!==SAVE_V||typeof o.el!=='object'||!o.el)return d;
  for(const k of ORDER)if(o.el[k]===1||o.el[k]===2||o.el[k]===3)d.el[k]=o.el[k];
  d.el.normal=1;if(d.el.gold)d.el.gold=1;
  d.started=!!o.started;d.cur=d.el[o.cur]&&o.cur!=='gold'?o.cur:'normal';
  for(const k of['done','frag','mem','wh'])if(o[k]&&typeof o[k]==='object')for(const j in o[k])if(o[k][j])d[k][j]=1;
  PATHS.forEach((p,i)=>{if(p[1].every(e=>d.done[ZONE[e][0]]))d.done['path'+(i+1)]=1}); /* saves from the 16-realm build */
  if(o.far&&typeof o.far==='object')for(const j in o.far)if(REALM_BY[j])d.far[j]=o.far[j]|0;
  d.realm=typeof o.realm==='string'&&REALM_BY[o.realm]?o.realm:null;d.ck=o.ck|0;d.deaths=o.deaths|0;d.time=+o.time||0;d.ended=!!o.ended;d.hubx=+o.hubx||0;
  if(o.set&&typeof o.set==='object')for(const k in d.set)if(typeof o.set[k]==='number'&&isFinite(o.set[k]))d.set[k]=clamp(o.set[k]|0,0,4);
  return d}catch(e){return defSave()}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ----- audio: everything synthesized, starts on first input ----- */
let AC=null,MUS=null,SFX=null,drone=[],mood=55,chimeT=2;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  try{AC=new A();MUS=AC.createGain();SFX=AC.createGain();MUS.connect(AC.destination);SFX.connect(AC.destination);applyVol();
    [1,1.5,2.01].forEach((m,i)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type=i?'sine':'triangle';o.frequency.value=mood*m;g.gain.value=.05/(i+1);l.frequency.value=.05+i*.04;lg.gain.value=.02/(i+1);
      l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(MUS);o.start();l.start();drone.push({o,m})})}catch(e){AC=null}}
function applyVol(){if(!AC)return;MUS.gain.value=S.set.music/4;SFX.gain.value=S.set.sfx/4}
function setMood(r){mood=r;if(!AC)return;try{drone.forEach(d=>d.o.frequency.setTargetAtTime(r*d.m,AC.currentTime,1.5))}catch(e){}}
function tone(f,d,type,v,f2,mus){if(!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0008,n+d);
  o.connect(g);g.connect(mus?MUS:SFX);o.start(n);o.stop(n+d+.02)}catch(e){}}
const SND={jump:[420,.14,'sine',.05,700],land:[130,.1,'sine',.05,60],hurt:[220,.4,'sawtooth',.07,50],atk:[620,.12,'square',.035,240],ehit:[300,.1,'triangle',.05,160],gold:[523,1.6,'triangle',.08,2093],deny:[160,.15,'square',.03,120],ck:[660,.5,'sine',.06,990],
  frag:[900,.4,'triangle',.06,1400],portal:[400,.9,'sine',.07,1600],equip:[520,.25,'sine',.05,880],ui:[700,.06,'sine',.03,900],open:[200,.6,'triangle',.05,400],
  break:[140,.3,'sawtooth',.06,50],master:[523,1.1,'triangle',.07,1568],mem:[330,1.4,'sine',.06,660]};
function sfx(n){const s=SND[n];if(s)tone(s[0],s[1],s[2],s[3],s[4])}
const PENT=[1,1.125,1.25,1.5,1.667,2];
function chime(dt){chimeT-=dt;if(chimeT<=0){chimeT=rnd(2.2,5);tone(mood*4*PENT[Math.floor(Math.random()*PENT.length)],2.4,'sine',.035,0,1)}}

/* ----- particles ----- */
let PT=[],RG=[];
function em(x,y,c,n,o){o=o||{};if(PT.length>600)return;n=Math.max(1,Math.round((n||1)*(S.set.fx?1:.5)*(S.set.calm?.6:1)));
  for(let i=0;i<n;i++){const l=rnd(.4,1)*(o.l||1);PT.push({x,y,vx:rnd(-1,1)*(o.sp||30)+(o.vx||0),vy:rnd(-1,1)*(o.sp||30)+(o.up||0),l,m:l,c,s:rnd(1.4,3.6)*(o.s||1),g:o.g||0})}}
function ring(x,y,c,r){RG.push({x,y,r:r||10,c,l:.7})}
function tickFx(dt){for(let i=PT.length-1;i>=0;i--){const q=PT[i];q.l-=dt;if(q.l<=0){PT[i]=PT[PT.length-1];PT.pop();continue}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
  for(let i=RG.length-1;i>=0;i--){const r=RG[i];r.r+=320*dt;r.l-=dt;if(r.l<=0)RG.splice(i,1)}}
function glow(x,y,r,c,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,1));g.addColorStop(1,rgba(c,0));const o=X.globalAlpha;X.globalAlpha=o*(a==null?1:a);X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2);X.globalAlpha=o}
function txt(s,x,y,font,c,al,blur){X.font=font;X.fillStyle=c;X.textAlign=al||'center';if(blur){X.shadowColor=c;X.shadowBlur=blur}X.fillText(s,x,y);X.shadowBlur=0}

/* ===== DATA: the forms, their three gifts (power, attack, resistance), the realms, the journey ===== */
const EL={
normal:{name:'Normal',c:'#dff1ff',c2:'#ffffff',pn:'',desc:'No elemental power',res:'Only the unformed may cross a Pale Veil',atk:'None — leap over what you cannot fight',weak:'Wields no element',up:'',line:''},
fire:{name:'Fire',c:'#ff7a2e',c2:'#ffd060',pn:'Ignite',desc:'Burn vines · light torches',res:'Heat — flame fields and lava cannot burn you',atk:'Fireball — a fast bolt that keeps burning',weak:'Water extinguishes it; cannot swim',up:'Ignite also strikes far ahead',line:'The power of flame awakens.'},
water:{name:'Water',c:'#38b6ff',c2:'#b8ecff',pn:'Splash',desc:'Douse braziers and flames · fill basins · wet dry soil',res:'Depth — never sinks; swims any pool (Down to dive)',atk:'Water Jet — a bolt that knocks wisps back',weak:'Storm arcs strike twice as hard',up:'A wider splash',line:'The patience of the deep awakens.'},
earth:{name:'Earth',c:'#4fd16a',c2:'#b6f59a',pn:'Growth',desc:'Grow vines from fertile soil',res:'Rooted — brambles cannot cut you; blows never knock you back',atk:'Root Lash — a heavy bolt that roots its target',weak:'Flame burns twice as hard',up:'Growth reaches farther',line:'The green memory of the world awakens.'},
electric:{name:'Electric',c:'#ffe94d',c2:'#ffffff',pn:'Shock',desc:'Power nodes · stun enemies',res:'Insulated — storm arcs are harmless',atk:'Chain Bolt — strikes the nearest wisp, then leaps to two more',weak:'Discharging in water hurts you',up:'A far wider reach',line:'The power of lightning awakens.'},
ice:{name:'Ice',c:'#a8ecff',c2:'#ffffff',pn:'Freeze',desc:'Freeze water solid · freeze enemies',res:'Coldproof — frost mist is harmless',atk:'Frost Shard — freezes what it hits',weak:'Flame burns twice as hard; ice melts',up:'A larger, longer freeze',line:'The stillness of winter awakens.'},
sticky:{name:'Sticky',c:'#e06bff',c2:'#ffb8f2',pn:'Tacky Leap',desc:'Cling to walls and ceilings',res:'Anchored — gales cannot move you while you touch the ground',atk:'Glue Glob — glues a wisp helplessly in place',weak:'Slow while clinging; water loosens the grip',up:'A stronger leap',line:'The grip of the unseen awakens.'},
acid:{name:'Acid',c:'#9dff2e',c2:'#e4ff9a',pn:'Corrode',desc:'Dissolve iron bars',res:'Toxin-proof — sludge is harmless',atk:'Acid Spit — keeps eating at its target',weak:'Cannot corrode stone or seals',up:'Corrodes from farther away',line:'The hunger that unmakes awakens.'},
powder:{name:'Powder',c:'#e8c267',c2:'#fff0c0',pn:'Disperse',desc:'Become dust · pass grates · ride vents',res:'Scatter — the dust absorbs one blow every 8 seconds',atk:'Sandblast — a burst that blinds nearby wisps',weak:'Cannot disperse in water; wind scatters it',up:'Longer dispersion',line:'The drift of ten thousand grains awakens.'},
air:{name:'Air',c:'#cfeeff',c2:'#ffffff',pn:'Gust',desc:'Double jump · glide · spin turbines',res:'Updraft — a fall returns you to the ledge, not the monument',atk:'Gale Blast — a burst that hurls wisps away',weak:'Too light to press anything',up:'Gust also launches you upward',line:'The breath of the sky awakens.'},
magnetic:{name:'Magnetic',c:'#ff4d6a',c2:'#6fa8ff',pn:'Attract / Repel',desc:'Hold E to pull iron plates · Shift to push',res:'Polarity — iron spikes bend away; wisp bolts curve aside',atk:'Polar Pulse — drags nearby wisps in and stuns them',weak:'Moves only iron',up:'Greater magnetic range',line:'The pull between all things awakens.'},
psychic:{name:'Psychic',c:'#c86bff',c2:'#ff9ae8',pn:'Levitate',desc:'Lift mindstone blocks for a time',res:'Mind ward — sentinels cannot sense or harm you',atk:'Mind Spike — strikes one distant wisp hard',weak:'The hold fades',up:'A longer hold, a farther reach',line:'The thought that moves stone awakens.'},
spiky:{name:'Spiky',c:'#2fd69a',c2:'#ff5a7a',pn:'Pierce',desc:'Burst membranes',res:'Thorns — lesser wisps die on touch; brambles cannot cut you',atk:'Thorn Volley — three fast thorns',weak:'Cannot pierce stone or iron',up:'Pierce also strikes far ahead',line:'The thorn that guards the rose awakens.'},
rock:{name:'Rock',c:'#b8a892',c2:'#ffb347',pn:'Smash',desc:'Break cracked stone · press heavy plates',res:'Bulwark — neither gales nor blows can move you',atk:'Boulder Slam — a crushing blow at close range',weak:'Slow; low jump; sinks',up:'Smash from farther away',line:'The weight of mountains awakens.',sp:.8,jp:.82},
phantom:{name:'Phantom',c:'#9aa6ff',c2:'#e6e0ff',pn:'Phase',desc:'Pass spectral veils · walk ghost-stone',res:'Intangible — while phased nothing can touch you',atk:'Soul Drain — saps a wisp; a kill restores a life',weak:'Cannot pass true stone',up:'Longer phasing',line:'The space between moments awakens.'},
crystal:{name:'Crystal',c:'#8fe9ff',c2:'#d9a6ff',pn:'Prism',desc:'Stand in light · bend it into lenses',res:'Refraction — wisp bolts reflect back at their makers',atk:'Prism Lance — a beam that pierces every wisp in line',weak:'Its power needs a light source',up:'Lights every lens at once',line:'The light within the stone awakens.'},
metal:{name:'Metal',c:'#c9d3e0',c2:'#ffffff',pn:'Fortify',desc:'Heavy enough for steel plates · E for armor',res:'Tempered — spikes cannot pierce you; Fortify stops arcs, flame and wisps',atk:'Iron Charge — an armored dash through wisps',weak:'Heavy; sludge corrodes twice as hard',up:'Longer armor',line:'The resolve of tempered steel awakens.',sp:.85,jp:.9},
gold:{name:'Gold',c:'#ffd24a',c2:'#fff6c8',pn:'Gold Status',desc:'A brief golden state granted by Gold Catalysts',res:'Everything — no hazard or wisp can harm you',atk:'Radiance — wisps perish at your touch',weak:'It fades in moments, and must be earned with fragments',up:'',line:''}};
/* unlock order: four paths of four, each path lighting opposite points of the wheel */
const STD=['fire','electric','powder','psychic','water','air','acid','spiky','earth','ice','crystal','metal','rock','magnetic','sticky','phantom'];
const ORDER=['normal',...STD,'gold'],FORMS=['normal',...STD];
/* the wheel, shared by the title screen, the Sanctuary monument and the form wheel: right side and left side, top to bottom */
const WHEEL_R=['electric','air','ice','magnetic','psychic','spiky','metal','phantom'],WHEEL_L=['fire','water','earth','rock','powder','acid','crystal','sticky'];
const WHEEL=['normal',...WHEEL_R,...WHEEL_L.slice().reverse()];
function wheelXY(e,cx,cy,R){let i=WHEEL_R.indexOf(e),s=1;if(i<0){i=WHEEL_L.indexOf(e);s=-1}const a=(i+.5)*Math.PI/8;return[cx+s*Math.sin(a)*R,cy-Math.cos(a)*R]}
/* each element's realm: theme id, name, hue */
const ZONE={fire:['ember','Ember Hollow','#ff5a2e'],water:['sunken','The Sunken Passage','#2a9cff'],earth:['verdant','The Verdant Ruins','#2fc85a'],electric:['thunder','The Thunderworks','#e8d020'],
ice:['frozen','The Frozen Expanse','#7ad8f8'],sticky:['adhesion','The Adhesion Caverns','#c050e8'],acid:['corrosive','The Corrosive Depths','#7ad820'],powder:['dunes','The Shifting Dunes','#d8aa48'],
air:['spires','The Skyward Spires','#98c8e8'],magnetic:['forge','The Polar Forge','#e84a6a'],psychic:['observatory','The Astral Observatory','#a050f0'],spiky:['labyrinth','The Thorned Labyrinth','#28b888'],
rock:['quarry','The Ancient Quarry','#b09a80'],phantom:['veil','The Veil Between','#7a80f0'],crystal:['cathedral','The Prism Cathedral','#70d8f8'],metal:['citadel','The Iron Citadel','#9aa8c0']};
const PATHS=[['Kindling',STD.slice(0,4),'#ff9a5a'],['Tempering',STD.slice(4,8),'#5ac8e8'],['Ascent',STD.slice(8,12),'#8ae8c0'],['Resolve',STD.slice(12,16),'#b8a0f0']];
/* attacks: [name, kind (b bolt, r burst, c chain, d dash), damage, speed|range, life|chain, effect] */
const ATK={fire:['Fireball','b',2,520,.9,'burn'],water:['Water Jet','b',1,600,.7,'push'],earth:['Root Lash','b',2,340,1.1,'root'],electric:['Chain Bolt','c',1,260,3,'stun'],
ice:['Frost Shard','b',1,560,.8,'freeze'],sticky:['Glue Glob','b',1,420,.95,'glue'],acid:['Acid Spit','b',1,480,.9,'corrode'],powder:['Sandblast','r',1,125,0,'stun'],
air:['Gale Blast','r',1,150,0,'push'],magnetic:['Polar Pulse','r',1,170,0,'pull'],psychic:['Mind Spike','c',2,330,1,''],spiky:['Thorn Volley','b',1,640,.55,'tri'],
rock:['Boulder Slam','r',3,95,0,''],phantom:['Soul Drain','c',1,210,1,'drain'],crystal:['Prism Lance','b',1,760,.6,'pierce'],metal:['Iron Charge','d',2,0,0,'']};
const ROMAN=['I','II','III','IV'];
const REALMS=[['awakening','The Awakening','#6a7cff','Empty. Silent. Unformed.'],
...PATHS.map((p,i)=>['path'+(i+1),'The Path of '+p[0],p[2],p[1].map(e=>EL[e].name).join(' · ')]),
['exp1','The Shattered Causeway','#e07a50','Expedition · Series I · 1 of 3'],['exp2','Stormglass Depths','#50c0d8','Expedition · Series I · 2 of 3'],['exp3','The Hollow Bastion','#b8a0e0','Expedition · Series I · 3 of 3'],
['convergence','The Convergence','#b8a0ff','The Trial of Sixteen'],['ascension','The Golden Ascension','#e0b030','The Final Harmony']]
  .map((a,i)=>({i,id:a[0],name:a[1],hue:a[2],sub:a[3],tut:i<=4,els:i>=1&&i<=4?PATHS[i-1][1]:null}));
const REALM_BY={};REALMS.forEach(r=>REALM_BY[r.id]=r);
const MEMZ=[['sunken','thunder'],['adhesion','dunes'],['forge','labyrinth'],['veil','citadel']];
const MEM={awakening:'Before the breaking, seventeen forces sang as one.',sunken:'The harmony did not die. It scattered.',
thunder:'Something empty survived — and emptiness can hold anything.',adhesion:'You were not made to wield the elements.',
dunes:'You were made to carry them home.',forge:'Each form you take is a memory returning.',labyrinth:'The sanctuary remembers your shape.',
veil:'Nothing was ever lost. Only waiting.',citadel:'What is clear can become all things.'};
function unlocked(i){if(i===0)return true;if(i<=7)return!!S.done[REALMS[i-1].id];if(i===8)return!!S.done.convergence||(!!S.done.exp3&&STD.every(e=>S.el[e]));return!!S.done.convergence}
function lockMsg(i){return'Sealed. Complete '+REALMS[i-1].name+' first'}
function chapDone(c){return!!S.done['path'+(c+1)]}
function maxHp(){let n=3;for(let c=0;c<4;c++)if(chapDone(c))n++;return n}
const FRN={};
function fragTotals(){for(const r of REALMS)FRN[r.id]=buildLevel(r.i).nf}
function fragGot(id){let n=0;const pre=id+':';for(const k in S.frag)if(k.startsWith(pre))n++;return Math.min(n,FRN[id]||n)}
function completion(){let n=0,t=0;REALMS.forEach(r=>{t+=1+(FRN[r.id]||0);if(S.done[r.id])n++;n+=fragGot(r.id)});STD.forEach(e=>{t+=3;n+=S.el[e]||0});
  for(const k in MEM){t++;if(S.mem[k])n++}return Math.round(100*n/t)}

/* ===== WORLD: level builder, puzzle segments, resistance nooks, wisp guards, gauntlets, realm layouts =====
   Every piece also records its intended solution (b.bot) so each realm can be machine-verified. */
function Builder(){const b={x:0,gy:GY,o:[],cps:[],hints:[],bot:[],n:0,fn:0};
  b.add=(t,x,y,w,h,ex)=>{const o=Object.assign({t,x,y,w,h},ex||{});b.o.push(o);return o};
  b.ground=w=>{b.add('g',b.x,b.gy,w,900-b.gy);b.x+=w;return b};
  b.gap=w=>{b.x+=w;return b};
  b.step=dy=>{b.gy+=dy;return b};
  b.bar=(t,x,w,ex)=>b.add(t,x,TOP,w,b.gy-TOP,Object.assign({d:0,op:0},ex||{}));
  b.id=()=>'L'+(++b.n);
  b.cp=()=>{b.cps.push({x:b.x+50,y:b.gy});return b};
  b.hint=(x,s)=>{b.hints.push([x,s]);return b};
  b.frag=(x,y)=>b.add('frag',x,y,26,26,{n:b.fn++});
  b.en=(k,x0,x1,ward)=>{const s={wisp:28,shade:34,spit:30,sent:40}[k],hp={wisp:1,shade:2,spit:2,sent:4}[k];
    return b.add('en',x0,b.gy-s-8,s,s,{k,x0,x1,dir:1,by:b.gy-s-8,stun:0,frz:0,hp,mhp:hp,ft:1.2,dot:0,fl:0,ward})};
  b.haz=(k,x,w)=>{const d={flame:[80,80],sludge:[14,14],spike:[16,16],arc:[144,160],frost:[90,90],bramble:[36,36]}[k];return b.add(k,x,b.gy-d[1],w,d[0])};
  b.level=()=>{if(b.gy!==GY){const ex=b.x;b.ground(140);b.gy=GY;b.bot.push(['R','x>',ex+150],['','g']);b.ground(300)}return b};

  case'gate':if(o.open&&o.op<1)o.op=Math.min(1,o.op+dt*1.3);if(o.ward&&!o.open){if(!wards){wards={};for(const e of G.o)if(e.t==='en'&&!e.dead&&e.ward)wards[e.ward]=1}if(!wards[o.id]){o.open=1;sfx('open');G.sh=.2}}break;
  case'pool':if(o.filling){o.fill+=dt;if(o.fill>=1){o.dry=0;o.filling=0}}if(o.iced>0)o.iced-=dt;break;
  case'ice':o.life-=dt;if(o.life<=0){o.rm=1;rm=1}break;
  case'lift':if(o.on){if(o.ph===0||o.ph===2){o.tm-=dt;if(o.tm<=0)o.ph=(o.ph+1)%4}else{const ty=o.ph===1?o.y1:o.y0,ny=appr(o.y,ty,70*dt);moveSolid(o,0,ny-o.y);if(ny===ty){o.ph=(o.ph+1)%4;o.tm=1.6}}}break;
  case'mplat':if(o.act>0)o.act-=dt;if(p.form==='magnetic'&&(K.E||K.S)&&!G.tf){const ax=o.ax,oc=ax==='x'?o.x+o.w/2:o.y+o.h/2,pc=ax==='x'?pcx:pcy;
      if(Math.hypot(o.x+o.w/2-pcx,o.y+o.h/2-pcy)<[0,420,500,620][S.el.magnetic||1]){let s=Math.abs(pc-oc)<6?0:Math.sign(pc-oc);if(!K.E)s=s?-s:(ax==='x'?p.f:1);
        if(s){const cur=o[ax],nv=clamp(cur+s*150*dt,o.a,o.b);if(nv!==cur){if(ax==='x')moveSolid(o,nv-cur,0);else moveSolid(o,0,nv-cur)}o.act=.15}}}break;
  case'pblock':{if(o.tm>0)o.tm-=dt;const ty=o.tm>0?o.ly:o.ry;if(o.y!==ty){const ny=appr(o.y,ty,170*dt),ride=p.g&&Math.abs(p.y+p.h-o.y)<3&&p.x+p.w>o.x&&p.x<o.x+o.w;
      if(!ride&&o.tm<=0&&ov(p,{x:o.x,y:ny,w:o.w,h:o.h}))break;moveSolid(o,0,ny-o.y)}}break;
  case'en':{if(o.dead){o.rm=1;rm=1;em(o.x+o.w/2,o.y+o.h/2,o.k==='sent'?'#ff4060':'#b070ff',22,{sp:150});break}if(o.fl>0)o.fl-=dt;if(o.stun>0)o.stun-=dt;if(o.frz>0)o.frz-=dt;
    if(o.dot>0){o.dot-=dt;if(o.dot<=0){hitEnemy(o,1);if(o.dead)break}}
    if(o.stun>0||o.frz>0)break;const ex=o.x+o.w/2;
    if(o.k==='shade'&&pcx>o.x0-90&&pcx<o.x1+o.w+90&&Math.abs(pcy-o.y)<200&&!(p.ph>0||p.dsp>0)){o.dir=pcx>ex?1:-1;o.x=clamp(o.x+o.dir*78*dt,o.x0,o.x1)}
    else if(o.k==='spit'){o.dir=pcx>ex?1:-1;o.ft-=dt;const dx=pcx-ex,dy=pcy-(o.y+o.h/2),d=Math.hypot(dx,dy);if(o.ft<=0&&d<430&&Math.abs(dy)<150&&d>30){o.ft=2.4;G.eb.push({x:ex,y:o.y+o.h/2,vx:dx/d*230,vy:dy/d*230,life:2.4});tone(240,.18,'square',.03,120)}else if(o.ft<=0)o.ft=.3}
    else{o.x+=o.dir*(o.k==='sent'?85:55)*dt;if(o.x>o.x1){o.x=o.x1;o.dir=-1}else if(o.x<o.x0){o.x=o.x0;o.dir=1}}

function stepShots(dt){const p=G.p,sol=G.shots.length||G.eb.length?solids():null,pcx=p.x+15,pcy=p.y+15;
  if(G.shots.length){const ens=G.o.filter(o=>o.t==='en'&&!o.dead);
    for(const s of G.shots){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(Math.random()<.5)em(s.x,s.y,s.c,1,{sp:14,l:.35});
      if(hitSolid({x:s.x-3,y:s.y-3,w:6,h:6},sol)){s.life=0;em(s.x,s.y,s.c,6,{sp:70});continue}
      for(const o of ens){if(o.dead||s.hit.includes(o)||s.x<o.x-5||s.x>o.x+o.w+5||s.y<o.y-7||s.y>o.y+o.h+7)continue;hitEnemy(o,s.dmg,s.eff,Math.sign(s.vx));em(s.x,s.y,s.c,8,{sp:90});if(s.eff==='pierce')s.hit.push(o);else{s.life=0;break}}}
    G.shots=G.shots.filter(s=>s.life>0)}
  if(G.eb.length){for(const s of G.eb){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const d=Math.hypot(s.x-pcx,s.y-pcy);
      if(hitSolid({x:s.x-3,y:s.y-3,w:6,h:6},sol)){s.life=0;continue}

      if(d<17){if(p.form==='crystal'&&!(p.gold>0)){G.shots.push({x:s.x,y:s.y,vx:-s.vx*1.6,vy:-s.vy*1.6,life:1.6,dmg:2,eff:'',c:'#8fe9ff',hit:[]});ring(pcx,pcy,'#8fe9ff',6);sfx('equip')}else if(!immune('bolt'))hurt(1);s.life=0}}

function hitSolid(r,sol){for(const o of sol)if(!o.ow&&ov(r,o))return o;return null}

  ring(cx,cy,'#ffd24a',10);ring(cx,cy,'#ffffff',40);ring(cx,cy,'#ffd24a',80);em(cx,cy,'#ffd24a',70,{sp:240});G.fl=.9;G.fc='#ffd24a';G.sh=.4;sfx('gold');
  banner(fin?'ELEMENTORB — MASTER OF ALL FORMS':'GOLD STATUS',fin?'From many forms, one harmony emerged.':'For a few breaths, nothing can harm you',"#ffd24a",fin?7:3.2)}

    if(k>=1){p.vent=null;p.vcd=.7;p.dsp=Math.max(p.dsp,.25)}return}

    else{p.vx=appr(p.vx,ax*130,1200*dt);p.vy=Math.min(110,p.vy+500*dt);if(p.jb>0&&p.g){p.vy=-250;p.jb=0}}}

  else{p.vx=appr(p.vx,ax*spd,(ax?(p.g?2400:1500):(p.g?2000:500))*dt);
    if(p.jb>0){if(p.cy>0){p.vy=-470*(e.jp||1);p.jb=0;p.cy=0;p.g=0;sfx('jump');em(cx,p.y+30,e.c,6,{sp:40})}
      else if(p.form==='air'&&!p.aj){p.vy=-430;p.aj=1;p.jb=0;sfx('jump');em(cx,p.y+30,'#cfeeff',14,{sp:80});ring(cx,p.y+30,'#cfeeff',4)}}
    if(up&&p.form==='air')p.vy=appr(p.vy,-260,2600*dt);
    else{let gr=1100;if(p.vy<0&&!jh&&p.nocut<=0)gr*=2.2;if(dsp)gr*=.5;p.vy=Math.min(dsp?220:900,p.vy+gr*dt);if(p.form==='air'&&jh&&p.vy>70)p.vy=70}}
  const anchored=p.form==='rock'||(p.form==='sticky'&&wasGr)||p.gold>0||p.dash>0,wv=wind&&!anchored?wind*(dsp?1.4:1):0,mx=(p.vx+wv)*dt;p.wall=0;
  if(mx){p.x+=mx;const o=hitSolid(p,sol);if(o){const dir=mx>0?1:-1;p.x=dir>0?o.x-p.w:o.x+o.w;const o2=hitSolid(p,sol);if(o2)p.x=dir>0?o2.x-p.w:o2.x+o2.w;p.vx=0;p.dash=0;if(p.form==='sticky'&&ax===dir&&o.t==='g'&&!o.slick&&!pool)p.wall=dir}}
  p.x=clamp(p.x,0,L.W-p.w);
  const vy0=p.vy,my=p.vy*dt;p.g=0;p.y+=my;
  for(const o of sol){if(!ov(p,o))continue;if(o.ow){if(my>0&&p.y+p.h-my<=o.y+1){p.y=o.y-p.h;p.g=1;p.vy=0}continue}
    if(my>=0){p.y=o.y-p.h;p.g=1;if(o.t==='g'&&p.x>=o.x&&p.x+p.w<=o.x+o.w)p.safe={x:p.x,y:p.y}}else{p.y=o.y+o.h;if(p.form==='sticky'&&o.t==='g'&&!o.slick&&!pool)p.ceil=1}p.vy=0}
  if(p.y<TOP){p.y=TOP;p.vy=0}
  if(p.g&&!wasGr&&vy0>380){em(p.x+15,p.y+30,e.c,8,{sp:60});sfx('land')}
  /* hazards, pickups, triggers */
  cx=p.x+15;cy=p.y+15;const hb={x:p.x+5,y:p.y+5,w:20,h:20},zone=(o,k,n)=>{if(!ov(hb,o)||immune(k))return;if(p.inv>0){p.vx=p.kd*300;if(p.lock<.08)p.lock=.08}else hurt(n,1)};

  case'spike':zone(o,'spike',1);break;case'frost':zone(o,'frost',1);break;case'bramble':zone(o,'bramble',1);break;

function timers(dt){const p=G.p;p.inv=Math.max(0,p.inv-dt);p.vcd=Math.max(0,p.vcd-dt);p.nocut=Math.max(0,p.nocut-dt);p.acd=Math.max(0,p.acd-dt);p.scat=Math.max(0,p.scat-dt);p.scatI=Math.max(0,p.scatI-dt);

let saveT=0;

  const nd=STD.filter(e=>S.el[e]).length;txt(nd+' / 16',wx,wy-2,'bold 26px Georgia','#ffffff',0,10);txt('elements awakened',wx,wy+18,'italic 12px Georgia','#a8b4d0');txt('♥ '+maxHp()+' lives   ·   '+completion()+'% complete',wx,wy+38,'12px Georgia','#ff8aa0');
  const rx=520,rw=412,y0=96,dy=37;
  for(let i=0;i<=N;i++){const y=y0+i*dy,sel=i===ui.i,R=i<N?REALMS[i]:null,u=R?unlocked(i):S.started,dn=R&&S.done[R.id],hue=R?R.hue:'#c4c8d4';
    if(sel){X.fillStyle=rgba(hue,.16);X.fillRect(rx-12,y-23,rw+24,dy-4);X.fillStyle=hue;X.fillRect(rx-12,y-23,3,dy-4)}
    const tag=!R?'✧':i===0?'·':i<=4?ROMAN[i-1]:i<=7?'E'+(i-4):'✧';txt(tag,rx+12,y,'bold 14px Georgia',u?hue:'#4a4d60');
    txt(R?R.name:'The Eternal Sanctuary',rx+34,y,(sel?'bold ':'')+'16px Georgia',u?(sel?'#ffffff':'#c8d4ea'):'#4a4d60','left');
    if(R&&R.els)R.els.forEach((e,k)=>{const ox=rx+232+k*22;if(S.el[e])drawOrb(ox,y-5,7,e);else{X.fillStyle='#14131f';X.strokeStyle='rgba(255,255,255,.16)';X.lineWidth=1;X.beginPath();X.arc(ox,y-5,7,0,TAU);X.fill();X.stroke()}});
    if(i===nx)txt('NEXT',rx+rw-70,y-1,'bold 11px Georgia','#ffffff',0,8+4*Math.sin(T*4));else if(dn)txt('✦',rx+rw-66,y,'14px Georgia','#ffe9a8',0,8);else if(R&&!u)txt('sealed',rx+rw-70,y-1,'italic 11px Georgia','#4a4d60');
    if(R&&FRN[R.id]&&u){const g=fragGot(R.id);txt('◆ '+g+'/'+FRN[R.id],rx+rw,y-1,'11px Georgia',g>=FRN[R.id]?'#ffe9a8':'#7fb8c8','right')}
    hit(rx-12,y-23,rw+24,dy-4,()=>{if(ui.i===i)pickRealm(i);else{ui.i=i;sfx('ui')}},i)}
  const i=ui.i,R=i<N?REALMS[i]:null,u=R?unlocked(i):true;txt(R?R.sub:'Neutral ground between the realms',VW/2,68,'bold 15px Georgia',R?(u?R.hue:'#6a6d80'):'#e8eaf0');
  txt(R&&!u?lockMsg(i):(R&&R.els?(chapDone(i-1)?'Walked — its four forms are yours':'Unlocks four elements at opposite points of the wheel  ·  +1 life')+'   ·   ':'')+'Enter or tap again to travel',VW/2,VH-18,'italic 13px Georgia','#a8b4d0');
  hit(VW-130,8,118,34,goBack);txt('‹ Back',VW-72,32,'bold 16px Georgia','#bff4ff')}
function drawControls(){txt('CONTROLS',VW/2,70,'bold 30px Georgia','#bff4ff',0,16);
  [['Move','A / D   or   ← / →'],['Jump  ·  climb  ·  swim up','W / ↑ / Space'],['Dive  ·  climb down  ·  drop from ceiling','S / ↓'],['Elemental power','E'],['Attack','X  or  K'],['Magnetic repel','Shift'],
   ['Choose a form','Hold Q — aim with mouse or ← →, release'],['Next form','Tap Q'],['Enter portal','F'],['Journey map','M'],['Return to last monument','R'],['Pause','Esc']].forEach((r,i)=>{const y=112+i*31;txt(r[0],VW/2-20,y,'16px Georgia','#c8d4ea','right');txt(r[1],VW/2+20,y,'bold 16px Georgia','#ffffff','left')});
  txt('Touch: on-screen buttons — ◎ form wheel, ⚔ attack, ✦ power, ⇄ repel',VW/2,VH-58,'italic 14px Georgia','#8fa3c8');txt('Press Enter or tap to return',VW/2,VH-26,'italic 14px Georgia','#6f7fa6');hit(0,0,VW,VH,goBack)}
function fmtTime(s){s=Math.floor(s);return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'}
function drawDone(){const L=G.L,R=L.R,r=G.res||{},nx=nextGoal();txt(R.els?'PATH COMPLETE':'REALM COMPLETE',VW/2,132,'bold 42px Georgia','#ffe9a8',0,24);txt(L.name+'  ·  '+R.sub,VW/2,168,'italic 18px Georgia','#c8d4ea');let y=216;
  if(r.up&&r.up.length){const w=r.up.length*34;r.up.forEach((e,k)=>drawOrb(VW/2-w/2+17+k*34,y-6,13,e));y+=30;txt(r.up.map(e=>EL[e].name).join(' · ')+' — Control attained (Mastery II)',VW/2,y,'bold 16px Georgia','#eef2ff',0,8);y+=32}
  if(r.life){txt('Path complete — you carry one more light of life',VW/2,y,'bold 18px Georgia','#ff8aa0',0,10);y+=34}
  if(R.id==='convergence'){txt('All sixteen elements mastered. The Golden Ascension opens.',VW/2,y,'bold 18px Georgia','#ffd24a',0,10);y+=34}
  if(R.id==='ascension'){txt('The harmony holds.',VW/2,y,'bold 18px Georgia','#ffd24a',0,10);y+=34}
  txt('◆ '+G.fg+' of '+L.nf+' fragments'+(MEM[R.id]?(S.mem[R.id]?'   ·   Memory recovered':'   ·   A memory remains hidden'):''),VW/2,y,'15px Georgia',G.fg>=L.nf?'#ffe9a8':'#9cc0ff');y+=28;
  txt(completion()+'% complete   ·   '+S.deaths+' falls   ·   '+fmtTime(S.time),VW/2,y,'15px Georgia','#8fa3c8');y+=40;
  if(nx>=0){const N=REALMS[nx];txt('NEXT ON THE JOURNEY',VW/2,y,'bold 11px Georgia','#8fa3c8');txt(N.name+'  —  '+N.sub,VW/2,y+24,'bold 18px Georgia',N.hue,0,10)}
  if(ui.t>.6){txt('Press Enter or tap — return to the Sanctuary',VW/2,VH-44,'italic 16px Georgia','#ffffff');hit(0,0,VW,VH,enterHub)}}
function drawEnding(){X.fillStyle='rgba(3,2,10,.5)';X.fillRect(0,0,VW,VH);const t=ui.t,ox=VW/2,oy=120;X.save();X.globalCompositeOperation='lighter';glow(ox,oy,260+Math.sin(T*2)*20,'#ffd24a',.5);X.restore();drawOrb(ox,oy,46,'gold');
  if(Math.random()<.8)em(ox+rnd(-200,200),oy+rnd(-90,160),Math.random()<.3?EL[STD[Math.floor(Math.random()*16)]].c:'#ffd24a',1,{up:-30,sp:30,l:1.6});drawFx();
  const a=s=>clamp((t-s)*.8,0,1);X.save();X.globalAlpha=a(.6);txt('“From nothing, all things became possible.”',VW/2,250,'italic 22px Georgia','#eef2ff');
  X.globalAlpha=a(2.6);txt('“From many forms, one harmony emerged.”',VW/2,292,'italic 22px Georgia','#eef2ff');
  X.globalAlpha=a(4.6);txt('ELEMENTORB — MASTER OF ALL FORMS',VW/2,356,'bold 34px Georgia','#ffd24a',0,26);
  X.globalAlpha=a(6.5);txt(completion()+'% complete   ·   '+S.deaths+' falls   ·   '+fmtTime(S.time),VW/2,404,'15px Georgia','#c8d4ea');txt('The harmony holds. Press Enter or tap — return to the Sanctuary',VW/2,VH-50,'italic 16px Georgia','#ffffff');X.restore();if(t>6.5)hit(0,0,VW,VH,enterHub)}
function draw(){X.setTransform(cv.width/VW,0,0,cv.height/VH,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.shadowBlur=0;HIT.length=0;
  if(G)drawWorld();else if(scr==='main')drawTitleBg();else drawBg(T*36,0,'awakening',S.ended?'#e0b030':'#6a5cff');
  if(!scr){if(G){drawHud();if(G.wheel)drawWheel()}return}
  if(G&&scr!=='ending'){X.fillStyle='rgba(3,2,10,'+(scr==='realms'||scr==='codex'?.94:.8)+')';X.fillRect(0,0,VW,VH)}
  ({main:drawMain,codex:drawCodex,realms:drawRealms,controls:drawControls,done:drawDone,ending:drawEnding}[scr]||drawList)()}

/* ===== MAIN: input and loop ===== */
const KEYMAP={KeyA:'L',ArrowLeft:'L',KeyD:'R',ArrowRight:'R',KeyW:'U',ArrowUp:'U',KeyS:'D',ArrowDown:'D',Space:'J',KeyE:'E',ShiftLeft:'S',ShiftRight:'S'};
function press(code,touch){audioInit();if(scr){uiKey(code);return}if(!G)return;const w=G.wheel;if(w&&(w.sticky||w.t>.18)){wheelKey(code);return}
  const k=KEYMAP[code];if(k)K[k]=1;const p=G.p;
  switch(code){case'Escape':case'KeyP':G.wheel=null;openScr('pause');break;
  case'KeyQ':if(!w&&!G.tf&&G.L.id!=='hub')G.wheel={sel:WHEEL.indexOf(p.form),t:0,sticky:!!touch,moved:false};break;
  case'KeyX':case'KeyK':attack();break;case'KeyM':G.wheel=null;openScr('realms');break;
  case'KeyE':power(0);break;case'ShiftLeft':case'ShiftRight':power(1);break;case'KeyF':case'Enter':interact();break;case'KeyR':respawn(true);break;
  case'Space':case'KeyW':case'ArrowUp':if(p.ceil)p.ceil=0;else if(code==='Space'&&p.wall&&!p.g&&p.form==='sticky'){p.vy=-470;p.vx=-p.wall*260;p.lock=.18;p.wall=0;p.nocut=.3;sfx('jump')}else p.jb=.12;break;
  case'KeyS':case'ArrowDown':p.ceil=0;break}}
function release(code){const k=KEYMAP[code];if(k)K[k]=0;if(code==='KeyQ'&&G&&G.wheel&&!G.wheel.sticky)closeWheel(true)}
function mpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}}
function boot(){S=loadSave();fragTotals();resize();addEventListener('resize',resize);
  addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Tab'||e.code==='Backspace')e.preventDefault();if(e.repeat&&!scr)return;press(e.code)});
  addEventListener('keyup',e=>release(e.code));addEventListener('blur',clearKeys);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){save();clearKeys();if(G&&!scr){G.wheel=null;openScr('pause')}}});addEventListener('pagehide',save);
  cv.addEventListener('pointermove',e=>{const m=mpos(e),w=G&&!scr&&G.wheel;if(w&&(w.sticky||w.t>.18)){const i=wheelAt(m);if(i>=0&&i!==w.sel){w.sel=i;w.moved=true}}
    else if(scr&&e.pointerType==='mouse')for(const h of HIT)if(h.i!=null&&m.x>=h.x&&m.x<=h.x+h.w&&m.y>=h.y&&m.y<=h.y+h.h)ui.i=h.i});
  cv.addEventListener('pointerdown',e=>{audioInit();const m=mpos(e),w=G&&!scr&&G.wheel;
    if(w){if(w.sticky){const i=wheelAt(m);if(i>=0){w.sel=i;closeWheel(true)}else closeWheel(false)}else if(w.t>.18)closeWheel(true);return}
    for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];if(m.x>=h.x&&m.x<=h.x+h.w&&m.y>=h.y&&m.y<=h.y+h.h){h.fn();return}}});
  const touchOn=()=>document.body.classList.add('touch');if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)touchOn();addEventListener('touchstart',touchOn,{once:true,passive:true});
  document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');press(k,true)});
    for(const v of['pointerup','pointerleave','pointercancel'])b.addEventListener(v,()=>{b.classList.remove('on');release(k)});b.addEventListener('contextmenu',e=>e.preventDefault())});
  let last=0;const frame=n=>{const dt=Math.min(.05,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(frame)};requestAnimationFrame(frame)}

boot();
})();
